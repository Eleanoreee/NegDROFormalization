name: Lean build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
